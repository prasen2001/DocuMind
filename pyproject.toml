[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "documind"
version = "0.15.2"
description = "Evidence-first PDF document intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "PyMuPDF>=1.26,<2",
]

[project.optional-dependencies]
vision = [
  "opencv-python-headless>=4.10,<6",
  "numpy>=2,<3",
]
semantic = [
  "torch>=2.8,<3",
  "transformers>=4.55,<6",
]
multimodal = [
  "torch>=2.8,<3",
  "transformers>=4.55,<6",
  "opencv-python-headless>=4.10,<6",
  "numpy>=2,<3",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
documind = "documind.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
documind = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

